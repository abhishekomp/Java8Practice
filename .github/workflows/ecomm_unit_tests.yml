# ══════════════════════════════════════════════════════════════════════════════
# Ecommerce Unit Tests Workflow
#
# PURPOSE:
#   Runs only the tests tagged @Tag("ecomm-unit-tests") on demand.
#   Unit tests are fast and focused — they test a single class in isolation
#   without hitting databases, APIs, or file systems.
#
# TRIGGER:
#   "workflow_dispatch" means this workflow is triggered MANUALLY from the
#   GitHub Actions UI (Actions tab → select this workflow → "Run workflow").
#   It does NOT run automatically on push.
#
# WHEN TO USE:
#   - After a targeted feature change when you only want to validate unit-level
#     behaviour quickly without waiting for the full test suite.
#   - As part of a scripted release process where unit tests are verified first.
# ══════════════════════════════════════════════════════════════════════════════

name: Ecommerce — Unit Tests

# ──────────────────────────────────────────────────────────────────────────────
# TRIGGER
# workflow_dispatch  → manual trigger only (button in the GitHub UI or via API).
# No push/pull_request triggers here — this is an on-demand workflow.
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# PERMISSIONS — read-only access to repository contents is all we need.
# ──────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read

jobs:

  # The job ID ("unit-test-job") appears in the GitHub Actions UI and in logs.
  # Use a descriptive ID — avoid generic names like "build".
  unit-test-job:
    runs-on: ubuntu-latest

    steps:

      # STEP 1 — Check out the code so Maven can find pom.xml and source files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2 — Install Java 21 and restore the Maven dependency cache.
      # The cache key is based on pom.xml — if pom.xml hasn't changed, the
      # cached ~/.m2 folder is restored, skipping re-downloads (~30s saved).
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # STEP 3 — Run only @Tag("ecomm-unit-tests") tests.
      # -Dgroups maps to JUnit 5 tag filtering via the Surefire plugin.
      # Only tests annotated with @Tag("ecomm-unit-tests") will be executed.
      - name: Run unit tests (tag = ecomm-unit-tests)
        run: mvn test --no-transfer-progress --batch-mode -Dgroups="ecomm-unit-tests"
