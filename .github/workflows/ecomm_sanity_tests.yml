# ══════════════════════════════════════════════════════════════════════════════
# Ecommerce Sanity Tests Workflow
#
# PURPOSE:
#   Runs only the tests tagged @Tag("ecomm-sanity") on demand.
#   Sanity (smoke) tests are a small, critical subset of tests designed to
#   answer one question quickly: "Is the application fundamentally working?"
#
#   They typically cover the most important happy paths — not edge cases.
#   Run them after a deployment to verify nothing catastrophic broke.
#
# TRIGGER:
#   Manual only (workflow_dispatch).  Typical usage:
#     1. Deploy to a staging environment
#     2. Trigger this workflow to verify the deployment succeeded
#     3. Only if sanity passes → proceed with full regression or release
#
# DIFFERENCE FROM UNIT TESTS:
#   Unit tests  → validate individual classes/methods (fast, isolated)
#   Sanity tests → validate the most critical end-to-end flows are not broken
# ══════════════════════════════════════════════════════════════════════════════

name: Ecommerce — Sanity Tests

# ──────────────────────────────────────────────────────────────────────────────
# TRIGGER — manual only.
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# PERMISSIONS — read-only.
# ──────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read

jobs:

  # Job ID is "sanity-test-job" — descriptive names make CI dashboards readable.
  sanity-test-job:
    runs-on: ubuntu-latest

    steps:

      # STEP 1 — Checkout source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2 — Install JDK 21 with Maven cache.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # STEP 3 — Run only @Tag("ecomm-sanity") tests.
      # These are the fast smoke tests that verify core functionality.
      - name: Run sanity tests (tag = ecomm-sanity)
        run: mvn test --no-transfer-progress --batch-mode -Dgroups="ecomm-sanity"
